syntax = "proto3";

package admin;
option go_package="admin-srv/pb/admin";

// ========== 管理员认证 ==========

// 管理员登录
message AdminLoginRequest {
  string username = 1;
  string password = 2;
}

message AdminLoginResponse {
  string token = 1;
  int32 admin_id = 2;
  string username = 3;
}

// 管理员登出
message AdminLogoutRequest {
  int32 admin_id = 1;
}

message AdminLogoutResponse {
  bool success = 1;
}

// 获取当前管理员信息
message GetCurrentAdminRequest {
  int32 admin_id = 1;
}

message GetCurrentAdminResponse {
  int32 id = 1;
  string username = 2;
  int32 role_id = 3;
  int32 status = 4;
  string role_name = 5;
}

// ========== 管理员管理 ==========

// 管理员列表
message GetAdminListRequest {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;
}

message AdminListItem {
  int32 id = 1;
  string username = 2;
  int32 role_id = 3;
  string role_name = 4;
  int32 status = 5;
  string last_login_time = 6;
}

message GetAdminListResponse {
  int32 total = 1;
  repeated AdminListItem list = 2;
}

// 管理员详情
message GetAdminDetailRequest {
  int32 admin_id = 1;
}

message GetAdminDetailResponse {
  int32 id = 1;
  string username = 2;
  int32 role_id = 3;
  string role_name = 4;
  int32 status = 5;
  string last_login_time = 6;
}

// 创建管理员
message CreateAdminRequest {
  string username = 1;
  string password = 2;
  int32 role_id = 3;
}

message CreateAdminResponse {
  int32 id = 1;
  bool success = 2;
}

// 编辑管理员
message UpdateAdminRequest {
  int32 admin_id = 1;
  string username = 2;
  int32 role_id = 3;
  int32 status = 4;
}

message UpdateAdminResponse {
  bool success = 1;
}

// 删除管理员
message DeleteAdminRequest {
  int32 admin_id = 1;
}

message DeleteAdminResponse {
  bool success = 1;
}

// 修改密码
message ChangePasswordRequest {
  int32 admin_id = 1;
  string old_password = 2;
  string new_password = 3;
}

message ChangePasswordResponse {
  bool success = 1;
  string message = 2;
}

// ========== 角色管理 ==========

// 角色列表
message GetRoleListRequest {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;
}

message RoleListItem {
  int32 id = 1;
  string name = 2;
  string remark = 3;
  int32 menu_ids = 4;
}

message GetRoleListResponse {
  int32 total = 1;
  repeated RoleListItem list = 2;
}

// 角色详情
message GetRoleDetailRequest {
  int32 role_id = 1;
}

message GetRoleDetailResponse {
  int32 id = 1;
  string name = 2;
  string remark = 3;
  repeated int32 menu_ids = 4;
}

// 创建角色
message CreateRoleRequest {
  string name = 1;
  string remark = 2;
  repeated int32 menu_ids = 3;
}

message CreateRoleResponse {
  int32 id = 1;
  bool success = 2;
}

// 更新角色
message UpdateRoleRequest {
  int32 role_id = 1;
  string name = 2;
  string remark = 3;
  repeated int32 menu_ids = 4;
}

message UpdateRoleResponse {
  bool success = 1;
}

// 删除角色
message DeleteRoleRequest {
  int32 role_id = 1;
}

message DeleteRoleResponse {
  bool success = 1;
}

// ========== 菜单管理 ==========

// 菜单列表（树形）
message GetMenuListRequest {
}

message MenuListItem {
  int32 id = 1;
  int32 parent_id = 2;
  string name = 3;
  string path = 4;
  string icon = 5;
  int32 sort = 6;
  repeated MenuListItem children = 7;
}

message GetMenuListResponse {
  repeated MenuListItem list = 1;
}

// 菜单详情
message GetMenuDetailRequest {
  int32 menu_id = 1;
}

message GetMenuDetailResponse {
  int32 id = 1;
  int32 parent_id = 2;
  string name = 3;
  string path = 4;
  string icon = 5;
  int32 sort = 6;
}

// 创建菜单
message CreateMenuRequest {
  int32 parent_id = 1;
  string name = 2;
  string path = 3;
  string icon = 4;
  int32 sort = 5;
}

message CreateMenuResponse {
  int32 id = 1;
  bool success = 2;
}

// 更新菜单
message UpdateMenuRequest {
  int32 menu_id = 1;
  int32 parent_id = 2;
  string name = 3;
  string path = 4;
  string icon = 5;
  int32 sort = 6;
}

message UpdateMenuResponse {
  bool success = 1;
}

// 删除菜单
message DeleteMenuRequest {
  int32 menu_id = 1;
}

message DeleteMenuResponse {
  bool success = 1;
}

// ========== 城市配置 ==========

// 城市列表
message GetCityListRequest {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;
}

message CityListItem {
  int32 id = 1;
  string city_code = 2;
  string city_name = 3;
  int32 status = 4;
}

message GetCityListResponse {
  int32 total = 1;
  repeated CityListItem list = 2;
}

// 创建城市
message CreateCityRequest {
  string city_code = 1;
  string city_name = 2;
  int32 status = 3;
}

message CreateCityResponse {
  int32 id = 1;
}

// 更新城市
message UpdateCityRequest {
  int32 id = 1;
  string city_code = 2;
  string city_name = 3;
  int32 status = 4;
}

message UpdateCityResponse {
  bool success = 1;
}

// 删除城市
message DeleteCityRequest {
  int32 id = 1;
}

message DeleteCityResponse {
  bool success = 1;
}

// ========== 车型配置 ==========

// 车型列表
message GetCarTypeListRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message CarTypeListItem {
  int32 id = 1;
  string type_name = 2;
  double base_price = 3;
  double km_price = 4;
  double minute_price = 5;
  int32 status = 6;
}

message GetCarTypeListResponse {
  int32 total = 1;
  repeated CarTypeListItem list = 2;
}

// 创建车型
message CreateCarTypeRequest {
  string type_name = 1;
  double base_price = 2;
  double km_price = 3;
  double minute_price = 4;
  int32 status = 5;
}

message CreateCarTypeResponse {
  int32 id = 1;
}

// 更新车型
message UpdateCarTypeRequest {
  int32 id = 1;
  string type_name = 2;
  double base_price = 3;
  double km_price = 4;
  double minute_price = 5;
  int32 status = 6;
}

message UpdateCarTypeResponse {
  bool success = 1;
}

// 删除车型
message DeleteCarTypeRequest {
  int32 id = 1;
}

message DeleteCarTypeResponse {
  bool success = 1;
}

// ========== 订单派发（后台给司机派单） ==========

// 后台派单请求（修改已有订单的司机信息）
message DispatchOrderRequest {
  string order_id = 1;            // 订单号（必填，待派单状态 status=0 的订单）
  int64 driver_id = 2;            // 目标司机ID（必填）
}

// 后台派单响应
message DispatchOrderResponse {
  bool success = 1;              // 是否成功
  string message = 2;            // 消息
  string order_id = 3;           // 订单ID
}

// 查询订单列表请求
message GetOrderListRequest {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;            // 关键词搜索（订单号/乘客手机/司机手机）
  int32 status = 4;              // 状态筛选：0=全部, 1=待接单, 2=已接单, 3=进行中, 4=已完成, 5=已取消
}

// 订单详情项
message OrderListItem {
  string order_id = 1;
  string passenger_name = 2;
  string passenger_phone = 3;
  string driver_name = 4;
  string driver_phone = 5;
  string car_type = 6;
  string start_address = 7;
  string end_address = 8;
  int32 status = 9;              // 1-待接单 2-已接单 3-司机已到 4-行程中 5-已完成 6-已取消
  double estimated_price = 10;
  double final_price = 11;
  int64 created_at = 12;         // 下单时间戳
}

// 查询订单列表响应
message GetOrderListResponse {
  int32 code = 1;
  string message = 2;
  int64 total = 3;
  repeated OrderListItem list = 4;
}

// Sync order status request
message SyncOrderStatusRequest {
  string order_id = 1;
  int32 status = 2;
  int64 driver_id = 3;
  double final_price = 4;
  string cancel_reason = 5;
}

// Sync order status response
message SyncOrderStatusResponse {
  int32 code = 1;
  string message = 2;
  string order_id = 3;
  int32 status = 4;
}

// ========== 登录日志与统计（亮点功能） ==========

// 登录日志查询请求
message GetLoginLogsRequest {
  int32 page = 1;              // 页码
  int32 page_size = 2;         // 每页数量
  int32 status = 3;            // 状态筛选：0=全部, 1=成功, 2=失败
  int64 admin_id = 4;          // 按管理员ID筛选
  string keyword = 5;          // 关键词搜索
}

// 登录日志项
message LoginLogItem {
  int32 id = 1;
  int32 admin_id = 2;
  string admin_name = 3;
  string ip = 4;
  string location = 5;
  string device_type = 6;
  string browser = 7;
  string os = 8;
  int32 status = 9;            // 0=失败 1=成功 2=锁定
  string fail_reason = 10;
  int64 login_time = 11;       // 时间戳
}

// 登录日志响应
message GetLoginLogsResponse {
  int32 code = 1;
  string message = 2;
  int64 total = 3;
  repeated LoginLogItem list = 4;
}

// 登录统计请求
message GetLoginStatsRequest {
  // 无需参数，返回全局统计数据
}

// 登录统计响应（仪表盘数据）
message GetLoginStatsResponse {
  int64 today_total = 1;        // 今日总登录次数
  int64 today_success = 2;      // 今日成功次数
  int64 today_fail = 3;         // 今日失败次数
  int64 week_total = 4;         // 本周总次数
  int64 month_total = 5;        // 本月总次数
  map<string, int64> daily_trend = 6;  // 近7天每日趋势 {date: count}
  
  message TopUserItem {
    int32 admin_id = 1;
    string admin_name = 2;
    int64 count = 3;            // 登录次数
  }
  repeated TopUserItem top_active_users = 7;  // TOP5活跃用户

  message RecentLogItem {
    int32 id = 1;
    string admin_name = 2;
    string ip = 3;
    string location = 4;
    int32 status = 5;
    int64 login_time = 6;
  }
  repeated RecentLogItem recent_logins = 8;     // 最近10次登录记录
}


// ========== Service ==========

service Admin {
  // 管理员认证（增强版：防暴力破解、登录日志、设备检测）
  rpc AdminLogin(AdminLoginRequest) returns (AdminLoginResponse); // 管理员登录：用户名密码验证，含防暴力破解+日志记录+设备检测
  rpc AdminLogout(AdminLogoutRequest) returns (AdminLogoutResponse); // 管理员登出：销毁Token
  rpc GetCurrentAdmin(GetCurrentAdminRequest) returns (GetCurrentAdminResponse); // 获取当前登录管理员信息

  // 登录日志与统计（亮点功能）
  rpc GetLoginLogs(GetLoginLogsRequest) returns (GetLoginLogsResponse); // 登录日志查询
  rpc GetLoginStats(GetLoginStatsRequest) returns (GetLoginStatsResponse); // 登录统计仪表盘数据

  // 管理员管理
  rpc GetAdminList(GetAdminListRequest) returns (GetAdminListResponse); // 获取管理员列表（分页）
  rpc GetAdminDetail(GetAdminDetailRequest) returns (GetAdminDetailResponse); // 获取管理员详情
  rpc CreateAdmin(CreateAdminRequest) returns (CreateAdminResponse); // 创建管理员账号
  rpc UpdateAdmin(UpdateAdminRequest) returns (UpdateAdminResponse); // 更新管理员信息
  rpc DeleteAdmin(DeleteAdminRequest) returns (DeleteAdminResponse); // 删除管理员（软删除）
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse); // 修改管理员密码

  // 角色管理
  rpc GetRoleList(GetRoleListRequest) returns (GetRoleListResponse); // 获取角色列表（分页）
  rpc GetRoleDetail(GetRoleDetailRequest) returns (GetRoleDetailResponse); // 获取角色详情
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse); // 创建角色
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse); // 更新角色
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse); // 删除角色

  // 菜单管理
  rpc GetMenuList(GetMenuListRequest) returns (GetMenuListResponse); // 获取菜单列表（树形）
  rpc GetMenuDetail(GetMenuDetailRequest) returns (GetMenuDetailResponse); // 获取菜单详情
  rpc CreateMenu(CreateMenuRequest) returns (CreateMenuResponse); // 创建菜单
  rpc UpdateMenu(UpdateMenuRequest) returns (UpdateMenuResponse); // 更新菜单
  rpc DeleteMenu(DeleteMenuRequest) returns (DeleteMenuResponse); // 删除菜单

  // 城市配置
  rpc GetCityList(GetCityListRequest) returns (GetCityListResponse); // 获取城市列表（分页）
  rpc CreateCity(CreateCityRequest) returns (CreateCityResponse); // 创建城市
  rpc UpdateCity(UpdateCityRequest) returns (UpdateCityResponse); // 更新城市
  rpc DeleteCity(DeleteCityRequest) returns (DeleteCityResponse); // 删除城市

  // 车型配置
  rpc GetCarTypeList(GetCarTypeListRequest) returns (GetCarTypeListResponse); // 获取车型列表（分页）
  rpc CreateCarType(CreateCarTypeRequest) returns (CreateCarTypeResponse); // 创建车型
  rpc UpdateCarType(UpdateCarTypeRequest) returns (UpdateCarTypeResponse); // 更新车型
  rpc DeleteCarType(DeleteCarTypeRequest) returns (DeleteCarTypeResponse); // 删除车型

  // 订单管理（后台派单给司机）
  rpc DispatchOrder(DispatchOrderRequest) returns (DispatchOrderResponse); // 后台派单：修改待派单订单，分配司机并通过MQ推送给司机端
  rpc GetOrderList(GetOrderListRequest) returns (GetOrderListResponse); // 订单列表查询
  rpc SyncOrderStatus(SyncOrderStatusRequest) returns (SyncOrderStatusResponse); // 同步订单状态
}
