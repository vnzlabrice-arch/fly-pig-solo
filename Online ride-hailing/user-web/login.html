<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>登录 - 飞猪出行</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    .login-page {
      min-height: 100vh;
      background: linear-gradient(180deg, var(--primary) 0%, var(--primary-light) 50%, var(--bg-gray) 100%);
      padding: 20px;
    }
    
    .login-header {
      padding: 40px 0;
      text-align: center;
    }
    
    .login-logo {
      font-size: 48px;
      margin-bottom: 16px;
    }
    
    .login-title {
      font-size: 28px;
      font-weight: 700;
      color: white;
      margin-bottom: 8px;
    }
    
    .login-subtitle {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
    }
    
    .login-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-lg);
    }
    
    .login-card h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .form-group {
      margin-bottom: 16px;
    }
    
    .form-label {
      display: block;
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    
    .form-input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    
    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.1);
    }
    
    .code-group {
      display: flex;
      gap: 12px;
    }
    
    .code-group .form-input {
      flex: 1;
    }
    
    .code-btn {
      flex-shrink: 0;
      padding: 14px 16px;
      background: var(--bg-gray);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 14px;
      color: var(--primary);
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      min-width: 100px;
    }
    
    .code-btn:hover:not(:disabled) {
      background: rgba(255, 107, 0, 0.1);
    }
    
    .code-btn:disabled {
      color: var(--text-light);
      cursor: not-allowed;
    }
    
    .login-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      border: none;
      border-radius: var(--radius-lg);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 16px rgba(255, 107, 0, 0.3);
    }
    
    .login-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 107, 0, 0.4);
    }
    
    .login-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }
    
    .register-link {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: var(--text-secondary);
    }
    
    .register-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }
    
    .back-home {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-header">
      <div class="login-logo">🚗</div>
      <h1 class="login-title">飞猪出行</h1>
      <p class="login-subtitle">花小猪同款出行体验</p>
    </div>
    
    <div class="login-card">
      <h2>手机号登录</h2>
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">手机号</label>
          <input type="tel" class="form-input" id="phone" name="phone" placeholder="请输入手机号" maxlength="11">
        </div>
        <div class="form-group">
          <label class="form-label">验证码</label>
          <div class="code-group">
            <input type="text" class="form-input" id="code" name="code" placeholder="请输入验证码" maxlength="6">
            <button type="button" class="code-btn" id="sendCodeBtn">获取验证码</button>
          </div>
        </div>
        <button type="submit" class="login-btn" id="loginBtn">登录</button>
      </form>
      <div class="register-link">
        还没有账号？<a href="./register.html">立即注册</a>
      </div>
      <a href="./ride-hailing.html" class="back-home">返回首页</a>
    </div>
  </div>
  
  <div class="toast" id="toast"></div>
  
  <script src="./api.js"></script>
  <script>
    (function() {
      const form = document.getElementById('loginForm');
      const phoneInput = document.getElementById('phone');
      const codeInput = document.getElementById('code');
      const sendCodeBtn = document.getElementById('sendCodeBtn');
      const loginBtn = document.getElementById('loginBtn');
      const toast = document.getElementById('toast');
      
      let countdown = 0;
      let timer = null;
      
      function showToast(message, type = 'success') {
        toast.textContent = message;
        toast.className = 'toast show ' + type;
        setTimeout(() => {
          toast.className = 'toast';
        }, 2500);
      }
      
      function toPhoneValid(phone) {
        return /^1\d{10}$/.test(phone);
      }
      
      function updateSendCodeBtn() {
        if (countdown > 0) {
          sendCodeBtn.disabled = true;
          sendCodeBtn.textContent = countdown + 's';
        } else {
          sendCodeBtn.disabled = false;
          sendCodeBtn.textContent = '获取验证码';
        }
      }
      
      function startCountdown() {
        countdown = 60;
        updateSendCodeBtn();
        timer = setInterval(() => {
          countdown--;
          updateSendCodeBtn();
          if (countdown <= 0) {
            clearInterval(timer);
            timer = null;
          }
        }, 1000);
      }
      
      sendCodeBtn.addEventListener('click', async () => {
        const phone = phoneInput.value.trim();
        if (!toPhoneValid(phone)) {
          showToast('请输入正确的手机号', 'error');
          return;
        }
        
        sendCodeBtn.disabled = true;
        try {
          const res = await window.UserApi.sendCode({ phone });
          if (window.UserApi.isSuccessCode(res.code)) {
            showToast('验证码已发送');
            startCountdown();
          } else {
            showToast(res.message || '发送失败', 'error');
            sendCodeBtn.disabled = false;
          }
        } catch (e) {
          showToast('网络错误', 'error');
          sendCodeBtn.disabled = false;
        }
      });
      
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const phone = phoneInput.value.trim();
        const code = codeInput.value.trim();
        
        if (!toPhoneValid(phone)) {
          showToast('请输入正确的手机号', 'error');
          return;
        }
        
        if (!code || code.length < 4) {
          showToast('请输入验证码', 'error');
          return;
        }
        
        loginBtn.disabled = true;
        loginBtn.textContent = '登录中...';
        
        try {
          const res = await window.UserApi.login({ phone, code });
          if (window.UserApi.isSuccessCode(res.code)) {
            showToast('登录成功');
            setTimeout(() => {
              const params = new URLSearchParams(window.location.search);
              const returnTo = params.get('returnTo') || 'ride-hailing.html';
              window.location.href = './' + returnTo;
            }, 500);
          } else {
            showToast(res.message || '登录失败', 'error');
          }
        } catch (e) {
          showToast('网络错误', 'error');
        } finally {
          loginBtn.disabled = false;
          loginBtn.textContent = '登录';
        }
      });
    })();
  </script>
</body>
</html>
