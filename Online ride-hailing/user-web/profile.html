<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>个人中心 - 花小猪</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #FF6B00;
      --primary-light: #FF8533;
      --primary-dark: #E55C00;
      --primary-bg: rgba(255,107,0,0.08);
      --success: #34C759;
      --danger: #FF3B30;
      --warning: #FF9500;
      --text-primary: #1A1A1A;
      --text-secondary: #666666;
      --text-light: #999999;
      --text-hint: #BBBBBB;
      --bg-white: #FFFFFF;
      --bg-gray: #F5F5F5;
      --bg-light: #FAFAFA;
      --border-color: #EEEEEE;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.10);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.14);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-gray);
      color: var(--text-primary);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app {
      max-width: 430px;
      margin: 0 auto;
      background: var(--bg-white);
      min-height: 100vh;
      position: relative;
      padding-bottom: calc(32px + var(--safe-bottom));
    }

    /* ========== Header ========== */
    .profile-header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      padding: 16px 20px 32px;
      position: relative;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .back-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.35); }

    .header-title {
      font-size: 18px;
      font-weight: 600;
      color: white;
    }

    .header-action {
      width: 36px;
      height: 36px;
      border: none;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .header-action:hover { background: rgba(255,255,255,0.35); }

    /* ========== User Card ========== */
    .user-card {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .user-avatar-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .user-avatar-lg {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255,255,255,0.3), rgba(255,255,255,0.15));
      border: 3px solid rgba(255,255,255,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: white;
      overflow: hidden;
    }
    .user-avatar-lg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .user-badge {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--success);
      border: 2px solid var(--primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: white;
    }

    .user-card-info {
      flex: 1;
      min-width: 0;
    }

    .user-name-lg {
      font-size: 22px;
      font-weight: 700;
      color: white;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }

    .user-phone-meta {
      font-size: 13px;
      color: rgba(255,255,255,0.85);
      margin-bottom: 6px;
    }

    .user-type-tag {
      display: inline-block;
      padding: 2px 10px;
      background: rgba(255,255,255,0.25);
      border-radius: 10px;
      font-size: 11px;
      color: white;
      font-weight: 500;
    }

    .user-stats {
      display: flex;
      gap: 0;
      margin-top: 20px;
      padding: 0 4px;
    }

    .stat-item {
      flex: 1;
      text-align: center;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .stat-item:hover { opacity: 0.8; }

    .stat-num {
      font-size: 22px;
      font-weight: 700;
      color: white;
      margin-bottom: 2px;
    }

    .stat-label {
      font-size: 11px;
      color: rgba(255,255,255,0.75);
    }

    .stat-divider {
      width: 1px;
      height: 24px;
      background: rgba(255,255,255,0.2);
      align-self: center;
    }

    /* ========== Section ========== */
    .section {
      background: var(--bg-white);
      margin: 12px 16px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .section-header {
      padding: 16px 18px 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .section-body {
      padding: 0 18px 18px;
    }

    /* ========== Info Item ========== */
    .info-item {
      display: flex;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--border-color);
      cursor: default;
    }
    .info-item:last-child { border-bottom: none; }

    .info-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      margin-right: 14px;
    }
    .info-icon.auth-icon { background: #FFF3E0; }
    .info-icon.phone-icon { background: #E3F2FD; }
    .info-icon.time-icon { background: #E8F5E9; }
    .info-icon.id-icon { background: #F3E5F5; }

    .info-content {
      flex: 1;
      min-width: 0;
    }

    .info-label {
      font-size: 12px;
      color: var(--text-light);
      margin-bottom: 2px;
    }

    .info-value {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .info-arrow {
      font-size: 16px;
      color: var(--text-hint);
      margin-left: 8px;
    }

    .info-item.clickable {
      cursor: pointer;
      transition: background 0.2s;
      padding: 14px 4px;
      margin: 0 -4px;
      border-radius: var(--radius-sm);
    }
    .info-item.clickable:hover {
      background: var(--bg-light);
    }
    .info-item.clickable:active {
      background: var(--bg-gray);
    }

    /* Auth status */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 4px;
    }
    .status-badge.verified {
      background: #E8F5E9;
      color: #2E7D32;
    }
    .status-badge.unverified {
      background: #FFF3E0;
      color: #E65100;
    }

    /* ========== Menu ========== */
    .menu-list {
      list-style: none;
    }

    .menu-item {
      display: flex;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      transition: background 0.2s;
      margin: 0 -4px;
      padding: 16px 4px;
      border-radius: var(--radius-sm);
    }
    .menu-item:last-child { border-bottom: none; }
    .menu-item:hover { background: var(--bg-light); }
    .menu-item:active { background: var(--bg-gray); }

    .menu-icon {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      margin-right: 12px;
      flex-shrink: 0;
    }
    .menu-icon.coupon { background: #FFF3E0; }
    .menu-icon.order { background: #E3F2FD; }
    .menu-icon.address { background: #E8F5E9; }
    .menu-icon.setting { background: #F5F5F5; }
    .menu-icon.logout { background: #FFEBEE; }

    .menu-text {
      flex: 1;
      font-size: 15px;
      font-weight: 500;
    }
    .menu-text.danger { color: var(--danger); }

    .menu-arrow {
      font-size: 16px;
      color: var(--text-hint);
    }

    .menu-badge {
      background: var(--danger);
      color: white;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 8px;
      margin-right: 8px;
    }

    /* ========== Modal ========== */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 300;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
    }
    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-sheet {
      background: var(--bg-white);
      width: 100%;
      max-width: 430px;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      max-height: 85vh;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .modal-overlay.active .modal-sheet {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      background: var(--bg-white);
      z-index: 1;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 600;
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border: none;
      background: var(--bg-gray);
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .modal-close:hover { background: var(--border-color); }

    .modal-body {
      padding: 20px;
    }

    .modal-footer {
      padding: 16px 20px 24px;
      display: flex;
      gap: 12px;
    }

    /* ========== Form ========== */
    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 15px;
      color: var(--text-primary);
      background: var(--bg-light);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-bg);
      background: var(--bg-white);
    }
    .form-input::placeholder { color: var(--text-hint); }
    .form-input:disabled {
      background: var(--bg-gray);
      color: var(--text-light);
      cursor: not-allowed;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }
    .input-row .form-input { flex: 1; }

    .sms-btn {
      flex-shrink: 0;
      height: 48px;
      padding: 0 16px;
      border: none;
      background: var(--primary);
      color: white;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      min-width: 110px;
    }
    .sms-btn:hover { background: var(--primary-dark); }
    .sms-btn:disabled {
      background: var(--text-hint);
      cursor: not-allowed;
    }

    .form-hint {
      font-size: 12px;
      color: var(--text-light);
      margin-top: 6px;
      line-height: 1.4;
    }

    .form-error {
      font-size: 12px;
      color: var(--danger);
      margin-top: 6px;
      display: none;
    }
    .form-error.show { display: block; }

    /* ========== Buttons ========== */
    .btn-primary {
      flex: 1;
      height: 48px;
      border: none;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      border-radius: var(--radius-md);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(255,107,0,0.25);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(255,107,0,0.35); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      flex: 1;
      height: 48px;
      border: 1.5px solid var(--border-color);
      background: var(--bg-white);
      color: var(--text-secondary);
      border-radius: var(--radius-md);
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-secondary:hover { background: var(--bg-light); }

    .btn-sm {
      height: 36px;
      padding: 0 16px;
      border: none;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-sm:hover { opacity: 0.9; }

    /* ========== Toast ========== */
    .toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      padding: 12px 24px;
      border-radius: var(--radius-lg);
      font-size: 14px;
      font-weight: 500;
      color: white;
      z-index: 999;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
      white-space: nowrap;
      max-width: calc(100% - 48px);
      text-align: center;
      box-shadow: var(--shadow-lg);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--danger); }
    .toast.info { background: #333; }

    /* ========== Loading ========== */
    .skeleton {
      background: linear-gradient(90deg, var(--bg-gray) 25%, #E8E8E8 50%, var(--bg-gray) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: var(--radius-sm);
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .loading-spinner-mini {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ========== Empty ========== */
    .profile-skeleton {
      padding: 0 16px;
    }

    /* Phone step indicator */
    .step-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
    }
    .step-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--border-color);
      transition: all 0.3s;
    }
    .step-dot.active { background: var(--primary); width: 24px; border-radius: 5px; }
    .step-dot.done { background: var(--success); }
    .step-line {
      width: 40px;
      height: 2px;
      background: var(--border-color);
      transition: background 0.3s;
    }
    .step-line.done { background: var(--success); }

    /* Fade in */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in {
      animation: fadeInUp 0.4s ease forwards;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <div class="profile-header">
      <div class="header-top">
        <button class="back-btn" id="backBtn">←</button>
        <span class="header-title">个人中心</span>
        <button class="header-action" id="editBtn">✎</button>
      </div>

      <!-- User Card -->
      <div class="user-card">
        <div class="user-avatar-wrap">
          <div class="user-avatar-lg" id="userAvatarLg">👤</div>
          <div class="user-badge" id="userBadge" title="已认证">✓</div>
        </div>
        <div class="user-card-info">
          <div class="user-name-lg" id="userNameLg">加载中...</div>
          <div class="user-phone-meta" id="userPhoneMeta">--</div>
          <span class="user-type-tag" id="userTypeTag">普通用户</span>
        </div>
      </div>

      <!-- Stats -->
      <div class="user-stats">
        <div class="stat-item" id="statOrder">
          <div class="stat-num">0</div>
          <div class="stat-label">我的订单</div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item" id="statCoupon">
          <div class="stat-num">0</div>
          <div class="stat-label">优惠券</div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item" id="statAuth">
          <div class="stat-num">未</div>
          <div class="stat-label">实名认证</div>
        </div>
      </div>
    </div>

    <!-- 账号信息 -->
    <div class="section animate-in" style="animation-delay: 0.05s;">
      <div class="section-header">账号信息</div>
      <div class="section-body">
        <!-- 实名认证 -->
        <div class="info-item clickable" id="realNameAuthEntry">
          <div class="info-icon auth-icon">🛡️</div>
          <div class="info-content">
            <div class="info-label">实名认证</div>
            <div class="info-value" id="realNameStatus">未认证</div>
          </div>
          <span class="status-badge unverified" id="realNameBadge">未认证</span>
          <span class="info-arrow">›</span>
        </div>

        <!-- 手机号 -->
        <div class="info-item clickable" id="phoneEntry">
          <div class="info-icon phone-icon">📱</div>
          <div class="info-content">
            <div class="info-label">手机号</div>
            <div class="info-value" id="phoneValue">--</div>
          </div>
          <span class="info-arrow">›</span>
        </div>

        <!-- 注册时间 -->
        <div class="info-item">
          <div class="info-icon time-icon">📅</div>
          <div class="info-content">
            <div class="info-label">注册时间</div>
            <div class="info-value" id="createTimeValue">--</div>
          </div>
        </div>


      </div>
    </div>

    <!-- 常用功能 -->
    <div class="section animate-in" style="animation-delay: 0.1s;">
      <div class="section-header">常用功能</div>
      <div class="section-body">
        <ul class="menu-list">
          <li class="menu-item" id="menuOrder">
            <span class="menu-icon order">📋</span>
            <span class="menu-text">我的订单</span>
            <span class="menu-arrow">›</span>
          </li>
          <li class="menu-item" id="menuCoupon">
            <span class="menu-icon coupon">🎫</span>
            <span class="menu-text">我的优惠券</span>
            <span class="menu-badge" id="couponCount" style="display:none;">0</span>
            <span class="menu-arrow">›</span>
          </li>
          <li class="menu-item" id="menuAddress">
            <span class="menu-icon address">📍</span>
            <span class="menu-text">常用地址</span>
            <span class="menu-arrow">›</span>
          </li>
          <li class="menu-item" id="menuSetting">
            <span class="menu-icon setting">⚙️</span>
            <span class="menu-text">设置</span>
            <span class="menu-arrow">›</span>
          </li>
        </ul>
      </div>
    </div>

    <!-- 退出登录 -->
    <div style="padding: 12px 16px;">
      <button class="btn-primary" id="logoutBtnProfile" style="background: var(--bg-white); color: var(--danger); box-shadow: none; border: 1.5px solid var(--border-color);">
        退出登录
      </button>
    </div>
  </div>

  <!-- ========== 实名认证弹窗 ========== -->
  <div class="modal-overlay" id="realNameModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3 class="modal-title">实名认证</h3>
        <button class="modal-close" id="closeRealNameModal">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-hint" style="margin-bottom: 20px; padding: 12px; background: #FFF8E1; border-radius: var(--radius-sm); color: #E65100;">
          💡 为了保障您的账号安全，请填写真实有效的身份信息
        </div>

        <div class="form-group">
          <label class="form-label">真实姓名</label>
          <input type="text" class="form-input" id="realNameInput" placeholder="请输入您的真实姓名" maxlength="20">
          <div class="form-error" id="realNameError">请输入真实姓名</div>
        </div>

        <div class="form-group">
          <label class="form-label">身份证号码</label>
          <input type="text" class="form-input" id="idCardInput" placeholder="请输入18位身份证号码" maxlength="18">
          <div class="form-error" id="idCardError">请输入正确的身份证号码</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="cancelRealName">取消</button>
        <button class="btn-primary" id="submitRealName">提交认证</button>
      </div>
    </div>
  </div>

  <!-- ========== 修改手机号弹窗 ========== -->
  <div class="modal-overlay" id="phoneModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3 class="modal-title">修改手机号</h3>
        <button class="modal-close" id="closePhoneModal">✕</button>
      </div>
      <div class="modal-body">
        <!-- Step indicator -->
        <div class="step-indicator">
          <div class="step-dot active" id="stepDot1"></div>
          <div class="step-line" id="stepLine1"></div>
          <div class="step-dot" id="stepDot2"></div>
          <div class="step-line" id="stepLine2"></div>
          <div class="step-dot" id="stepDot3"></div>
        </div>

        <!-- Step 1: 验证原手机 -->
        <div id="phoneStep1">
          <div class="form-group">
            <label class="form-label">当前手机号</label>
            <input type="text" class="form-input" id="oldPhoneDisplay" disabled>
          </div>
          <div class="form-group">
            <label class="form-label">短信验证码</label>
            <div class="input-row">
              <input type="text" class="form-input" id="oldPhoneCode" placeholder="请输入验证码" maxlength="6">
              <button class="sms-btn" id="sendOldCodeBtn">获取验证码</button>
            </div>
            <div class="form-error" id="oldCodeError">请输入验证码</div>
          </div>
          <button class="btn-primary" id="verifyOldPhone">下一步</button>
        </div>

        <!-- Step 2: 输入新手机 -->
        <div id="phoneStep2" style="display:none;">
          <div class="form-group">
            <label class="form-label">新手机号</label>
            <input type="text" class="form-input" id="newPhoneInput" placeholder="请输入新手机号" maxlength="11">
            <div class="form-error" id="newPhoneError">请输入正确的手机号</div>
          </div>
          <div class="form-group">
            <label class="form-label">短信验证码</label>
            <div class="input-row">
              <input type="text" class="form-input" id="newPhoneCode" placeholder="请输入验证码" maxlength="6">
              <button class="sms-btn" id="sendNewCodeBtn">获取验证码</button>
            </div>
            <div class="form-error" id="newCodeError">请输入验证码</div>
          </div>
          <div style="display:flex;gap:12px;">
            <button class="btn-secondary" id="backStep1">上一步</button>
            <button class="btn-primary" id="submitNewPhone">确认修改</button>
          </div>
        </div>

        <!-- Step 3: 成功 -->
        <div id="phoneStep3" style="display:none; text-align:center; padding: 40px 0;">
          <div style="font-size: 56px; margin-bottom: 16px;">✅</div>
          <div style="font-size: 18px; font-weight: 600; margin-bottom: 8px;">手机号修改成功</div>
          <div style="color: var(--text-secondary); margin-bottom: 24px;">您的新手机号已生效</div>
          <button class="btn-primary" id="donePhoneChange">完成</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="./api.js"></script>
  <script>
  (function() {
    'use strict';

    // ======== State ========
    const state = {
      userId: null,
      token: null,
      userInfo: null,
      isRealNameAuthed: false,
      realName: '',
      phoneStep: 1,
      oldPhoneVerified: false,
      smsTimers: {},
    };

    // ======== DOM Refs ========
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);

    const dom = {
      // Header
      userAvatarLg: $('#userAvatarLg'),
      userBadge: $('#userBadge'),
      userNameLg: $('#userNameLg'),
      userPhoneMeta: $('#userPhoneMeta'),
      userTypeTag: $('#userTypeTag'),
      // Stats
      statOrder: $('#statOrder'),
      statCoupon: $('#statCoupon'),
      statAuth: $('#statAuth'),
      // Info
      realNameStatus: $('#realNameStatus'),
      realNameBadge: $('#realNameBadge'),
      phoneValue: $('#phoneValue'),
      createTimeValue: $('#createTimeValue'),
      userIdValue: $('#userIdValue'),
      // Real name modal
      realNameModal: $('#realNameModal'),
      realNameInput: $('#realNameInput'),
      idCardInput: $('#idCardInput'),
      realNameError: $('#realNameError'),
      idCardError: $('#idCardError'),
      // Phone modal
      phoneModal: $('#phoneModal'),
      oldPhoneDisplay: $('#oldPhoneDisplay'),
      oldPhoneCode: $('#oldPhoneCode'),
      sendOldCodeBtn: $('#sendOldCodeBtn'),
      newPhoneInput: $('#newPhoneInput'),
      newPhoneCode: $('#newPhoneCode'),
      sendNewCodeBtn: $('#sendNewCodeBtn'),
      // Toast
      toast: $('#toast'),
    };

    // ======== Toast ========
    let toastTimer = null;
    function showToast(msg, type = 'info') {
      clearTimeout(toastTimer);
      dom.toast.textContent = msg;
      dom.toast.className = `toast show ${type}`;
      toastTimer = setTimeout(() => {
        dom.toast.className = 'toast';
      }, 2500);
    }

    // ======== Init ========
    function initState() {
      state.token = localStorage.getItem('user_token') || '';

      let savedUserId = localStorage.getItem('user_id');
      if (savedUserId) {
        savedUserId = String(savedUserId).trim();
        if (savedUserId.includes(':')) savedUserId = savedUserId.split(':')[0];
        savedUserId = savedUserId.replace(/[^0-9]/g, '');
        state.userId = parseInt(savedUserId, 10) || 0;
      }

      state.isRealNameAuthed = localStorage.getItem('real_name_authed') === 'true';
      state.realName = localStorage.getItem('real_name') || '';

      if (!state.token || !state.userId) {
        window.location.href = './login.html?returnTo=profile.html';
        return false;
      }
      return true;
    }

    // ======== Format Helpers ========
    function maskPhone(phone) {
      if (!phone) return '--';
      const s = String(phone);
      if (s.length === 11) return s.replace(/(\d{3})\d{4}(\d{4})/, '$1****$2');
      return s;
    }

    function maskIdCard(idCard) {
      if (!idCard) return '--';
      const s = String(idCard);
      if (s.length === 18) return s.replace(/(\d{6})\d{8}(\d{4})/, '$1********$2');
      return s;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '--';
      try {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return dateStr;
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      } catch { return dateStr; }
    }

    function getUserTypeLabel(type) {
      const t = Number(type);
      if (t === 1) return 'VIP用户';
      if (t === 2) return '认证司机';
      return '普通用户';
    }

    // ======== Load Data ========
    async function loadUserInfo() {
      try {
        const resp = await window.UserApi.getUserDetail({ user_id: state.userId });
        if (window.UserApi.isSuccessCode(resp.code) && resp.data) {
          state.userInfo = resp.data;
          renderUserInfo();
        } else {
          if (resp.code === 401 || resp.code === 403) {
            showToast('登录已过期，请重新登录', 'error');
            setTimeout(() => {
              localStorage.clear();
              window.location.href = './login.html?returnTo=profile.html';
            }, 1500);
            return;
          }
          showToast('加载用户信息失败', 'error');
        }
      } catch (e) {
        console.error('加载用户信息失败:', e);
        showToast('网络错误，请稍后重试', 'error');
      }
    }

    async function loadStats() {
      if (!state.userId) return;
      try {
        // 加载订单统计
        const orderResp = await window.UserApi.getUserOrderList({
          userId: state.userId, status: 0, page: 1, pageSize: 1
        });
        if (orderResp && orderResp.data) {
          // Try to get total count
          const total = orderResp.data.total || orderResp.data.Total || orderResp.data.count || 0;
          dom.statOrder.querySelector('.stat-num').textContent = total;
        }
      } catch (e) {
        console.error('加载统计数据失败:', e);
      }

      try {
        // 加载优惠券统计
        const couponResp = await window.UserApi.getUserCouponList({
          userId: state.userId, status: 1, page: 1, pageSize: 1
        });
        if (couponResp && couponResp.data) {
          const total = couponResp.data.total || couponResp.data.Total || couponResp.data.count || 0;
          dom.statCoupon.querySelector('.stat-num').textContent = total;
        }
      } catch (e) {
        console.error('加载优惠券统计失败:', e);
      }
    }

    // ======== Render ========
    function renderUserInfo() {
      const info = state.userInfo;
      if (!info) return;

      const nickname = info.Nickname || info.nickname || '用户';
      const phone = info.Phone || info.phone || '';
      const avatar = info.Avatar || info.avatar || '';
      const userType = info.UserType ?? info.user_type ?? 0;
      // create_time / user_type 都是 int64 数字，用 ?? 避免 0 被误判为 falsy
      const createTime = info.CreateTime ?? info.create_time ?? '';
      const userId = info.UserId ?? info.user_id ?? state.userId;

      // Avatar
      if (avatar && avatar.startsWith('http')) {
        dom.userAvatarLg.innerHTML = `<img src="${avatar}" alt="${nickname}" onerror="this.parentElement.textContent='${nickname.charAt(0).toUpperCase()}'">`;
      } else {
        dom.userAvatarLg.textContent = nickname.charAt(0).toUpperCase();
      }

      // Name & phone
      dom.userNameLg.textContent = nickname;
      dom.userPhoneMeta.textContent = maskPhone(phone);
      dom.userTypeTag.textContent = getUserTypeLabel(userType);

      // Badge
      if (state.isRealNameAuthed) {
        dom.userBadge.style.display = 'flex';
      } else {
        dom.userBadge.style.display = 'none';
      }

      // Info
      dom.phoneValue.textContent = maskPhone(phone);
      dom.createTimeValue.textContent = formatDate(createTime);

      // Auth status
      if (state.isRealNameAuthed) {
        dom.realNameStatus.textContent = `已认证 · ${state.realName || ''}`;
        dom.realNameBadge.textContent = '已认证';
        dom.realNameBadge.className = 'status-badge verified';
        dom.statAuth.querySelector('.stat-num').textContent = '已';
      } else {
        dom.realNameStatus.textContent = '未认证';
        dom.realNameBadge.textContent = '未认证';
        dom.realNameBadge.className = 'status-badge unverified';
        dom.statAuth.querySelector('.stat-num').textContent = '未';
      }
    }

    // ======== Modal Helpers ========
    function openModal(modalEl) {
      modalEl.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal(modalEl) {
      modalEl.classList.remove('active');
      document.body.style.overflow = '';
    }

    // Close modals on overlay click
    document.addEventListener('click', function(e) {
      if (e.target.classList.contains('modal-overlay') && e.target.classList.contains('active')) {
        closeModal(e.target);
      }
    });

    // ======== Real Name Auth ========
    function openRealNameModal() {
      if (state.isRealNameAuthed) {
        showToast('您已完成实名认证', 'info');
        return;
      }
      dom.realNameInput.value = '';
      dom.idCardInput.value = '';
      dom.realNameError.classList.remove('show');
      dom.idCardError.classList.remove('show');
      openModal(dom.realNameModal);
    }

    function closeRealNameModal() {
      closeModal(dom.realNameModal);
    }

    function validateIdCard(idCard) {
      if (!idCard || idCard.length !== 18) return false;
      // Basic format check
      const reg = /^\d{17}[\dXx]$/;
      if (!reg.test(idCard)) return false;
      // Checksum validation
      const weights = [7,9,10,5,8,4,2,1,6,3,7,9,10,5,8,4,2];
      const checkCodes = ['1','0','X','9','8','7','6','5','4','3','2'];
      let sum = 0;
      for (let i = 0; i < 17; i++) {
        sum += parseInt(idCard[i]) * weights[i];
      }
      const checkCode = checkCodes[sum % 11];
      return idCard[17].toUpperCase() === checkCode;
    }

    async function submitRealNameAuth() {
      const realName = dom.realNameInput.value.trim();
      const idCard = dom.idCardInput.value.trim().toUpperCase();

      // Validate
      let valid = true;
      if (!realName || realName.length < 2) {
        dom.realNameError.classList.add('show');
        valid = false;
      } else {
        dom.realNameError.classList.remove('show');
      }

      if (!validateIdCard(idCard)) {
        dom.idCardError.textContent = '请输入正确的18位身份证号码';
        dom.idCardError.classList.add('show');
        valid = false;
      } else {
        dom.idCardError.classList.remove('show');
      }

      if (!valid) return;

      // Submit
      const btn = $('#submitRealName');
      btn.disabled = true;
      btn.innerHTML = '<span class="loading-spinner-mini"></span>提交中...';

      try {
        const resp = await window.UserApi.realNameAuth({
          user_id: state.userId,
          real_name: realName,
          id_card: idCard,
        });

        if (window.UserApi.isSuccessCode(resp.code)) {
          state.isRealNameAuthed = true;
          state.realName = realName;
          localStorage.setItem('real_name_authed', 'true');
          localStorage.setItem('real_name', realName);
          renderUserInfo();
          closeRealNameModal();
          showToast('实名认证成功！', 'success');
        } else {
          showToast(resp.message || '认证失败，请重试', 'error');
        }
      } catch (e) {
        showToast('网络错误，请稍后重试', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '提交认证';
      }
    }

    // ======== SMS Timer ========
    function startSmsTimer(btnEl, phone, timerKey, duration = 60) {
      if (state.smsTimers[timerKey]) return;

      let seconds = duration;
      btnEl.disabled = true;

      // Send code
      window.UserApi.sendCode({ phone }).then(resp => {
        if (window.UserApi.isSuccessCode(resp.code)) {
          showToast('验证码已发送', 'success');
        } else {
          showToast(resp.message || '发送验证码失败', 'error');
          btnEl.disabled = false;
          btnEl.textContent = '获取验证码';
          return;
        }

        state.smsTimers[timerKey] = setInterval(() => {
          seconds--;
          btnEl.textContent = `${seconds}s后重发`;
          if (seconds <= 0) {
            clearInterval(state.smsTimers[timerKey]);
            state.smsTimers[timerKey] = null;
            btnEl.disabled = false;
            btnEl.textContent = '获取验证码';
          }
        }, 1000);
      }).catch(() => {
        btnEl.disabled = false;
        showToast('网络错误', 'error');
      });
    }

    // ======== Phone Change ========
    function openPhoneModal() {
      // Reset state
      state.phoneStep = 1;
      state.oldPhoneVerified = false;
      dom.oldPhoneCode.value = '';
      dom.newPhoneInput.value = '';
      dom.newPhoneCode.value = '';
      $('#oldCodeError').classList.remove('show');
      $('#newPhoneError').classList.remove('show');
      $('#newCodeError').classList.remove('show');

      // Display old phone
      const phone = state.userInfo?.Phone || state.userInfo?.phone || '';
      dom.oldPhoneDisplay.value = maskPhone(phone);

      // Show step 1
      showPhoneStep(1);
      openModal(dom.phoneModal);
    }

    function closePhoneModal() {
      // Clear timers
      Object.values(state.smsTimers).forEach(t => clearInterval(t));
      state.smsTimers = {};
      closeModal(dom.phoneModal);
    }

    function showPhoneStep(step) {
      state.phoneStep = step;
      $('#phoneStep1').style.display = step === 1 ? 'block' : 'none';
      $('#phoneStep2').style.display = step === 2 ? 'block' : 'none';
      $('#phoneStep3').style.display = step === 3 ? 'block' : 'none';

      // Update step indicator
      $$('.step-dot').forEach((d, i) => {
        d.classList.remove('active', 'done');
        if (i + 1 < step) d.classList.add('done');
        if (i + 1 === step) d.classList.add('active');
      });
      $$('.step-line').forEach((l, i) => {
        l.classList.toggle('done', i + 1 < step);
      });
    }

    async function verifyOldPhone() {
      const code = dom.oldPhoneCode.value.trim();
      if (!code || code.length < 4) {
        $('#oldCodeError').classList.add('show');
        return;
      }
      $('#oldCodeError').classList.remove('show');

      // We'll just mark as verified (backend validates during updatePhone)
      // Or we could make an API call to verify the code
      state.oldPhoneVerified = true;
      showToast('验证成功', 'success');
      showPhoneStep(2);
    }

    async function submitNewPhone() {
      const newPhone = dom.newPhoneInput.value.trim();
      const newCode = dom.newPhoneCode.value.trim();

      // Validate
      if (!/^1[3-9]\d{9}$/.test(newPhone)) {
        $('#newPhoneError').classList.add('show');
        $('#newPhoneError').textContent = '请输入正确的手机号';
        return;
      }
      $('#newPhoneError').classList.remove('show');

      if (!newCode || newCode.length < 4) {
        $('#newCodeError').classList.add('show');
        return;
      }
      $('#newCodeError').classList.remove('show');

      const oldPhone = state.userInfo?.Phone || state.userInfo?.phone || '';

      // Submit
      const btn = $('#submitNewPhone');
      btn.disabled = true;
      btn.innerHTML = '<span class="loading-spinner-mini"></span>修改中...';

      try {
        const resp = await window.UserApi.updatePhone({
          userId: state.userId,
          oldPhone: oldPhone,
          newPhone: newPhone,
          code: newCode,
        });

        if (window.UserApi.isSuccessCode(resp.code)) {
          // Update local info
          if (state.userInfo) {
            state.userInfo.Phone = newPhone;
            state.userInfo.phone = newPhone;
          }
          renderUserInfo();
          showToast('手机号修改成功', 'success');
          showPhoneStep(3);
        } else {
          showToast(resp.message || '修改失败，请重试', 'error');
        }
      } catch (e) {
        showToast('网络错误，请稍后重试', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '确认修改';
      }
    }

    function donePhoneChange() {
      closePhoneModal();
    }

    function goBackStep1() {
      showPhoneStep(1);
    }

    // ======== Logout ========
    function logout() {
      localStorage.removeItem('user_token');
      localStorage.removeItem('user_id');
      localStorage.removeItem('real_name_authed');
      localStorage.removeItem('real_name');
      state.token = '';
      state.userId = null;
      state.userInfo = null;
      state.isRealNameAuthed = false;
      state.realName = '';
      showToast('已退出登录', 'success');
      setTimeout(() => {
        window.location.href = './ride-hailing.html';
      }, 500);
    }

    // ======== Event Bindings ========
    function bindEvents() {
      // Back
      $('#backBtn').addEventListener('click', () => {
        window.location.href = './ride-hailing.html';
      });

      // Edit (placeholder)
      $('#editBtn').addEventListener('click', () => {
        showToast('编辑功能开发中', 'info');
      });

      // Real name auth
      $('#realNameAuthEntry').addEventListener('click', openRealNameModal);
      $('#closeRealNameModal').addEventListener('click', closeRealNameModal);
      $('#cancelRealName').addEventListener('click', closeRealNameModal);
      $('#submitRealName').addEventListener('click', submitRealNameAuth);

      // Real name input validation
      dom.realNameInput.addEventListener('input', () => {
        if (dom.realNameInput.value.trim().length >= 2) {
          dom.realNameError.classList.remove('show');
        }
      });
      dom.idCardInput.addEventListener('input', () => {
        if (dom.idCardInput.value.length >= 18) {
          dom.idCardError.classList.remove('show');
        }
      });

      // Phone modal
      $('#phoneEntry').addEventListener('click', openPhoneModal);
      $('#closePhoneModal').addEventListener('click', closePhoneModal);

      // Send old code
      dom.sendOldCodeBtn.addEventListener('click', () => {
        const phone = state.userInfo?.Phone || state.userInfo?.phone || '';
        if (!phone) { showToast('无法获取手机号', 'error'); return; }
        startSmsTimer(dom.sendOldCodeBtn, phone, 'oldCode');
      });

      // Verify old phone
      $('#verifyOldPhone').addEventListener('click', verifyOldPhone);

      // Send new code
      dom.sendNewCodeBtn.addEventListener('click', () => {
        const newPhone = dom.newPhoneInput.value.trim();
        if (!/^1[3-9]\d{9}$/.test(newPhone)) {
          showToast('请先输入正确的手机号', 'error');
          return;
        }
        startSmsTimer(dom.sendNewCodeBtn, newPhone, 'newCode');
      });

      // Submit new phone
      $('#submitNewPhone').addEventListener('click', submitNewPhone);
      $('#donePhoneChange').addEventListener('click', donePhoneChange);
      $('#backStep1').addEventListener('click', goBackStep1);

      // Menu navigation
      $('#menuOrder').addEventListener('click', () => {
        window.location.href = './order.html';
      });
      $('#menuCoupon').addEventListener('click', () => {
        window.location.href = './coupons.html';
      });
      $('#menuAddress').addEventListener('click', () => {
        showToast('常用地址功能开发中', 'info');
      });
      $('#menuSetting').addEventListener('click', () => {
        showToast('设置功能开发中', 'info');
      });

      // Stats click
      $('#statOrder').addEventListener('click', () => {
        window.location.href = './order.html';
      });
      $('#statCoupon').addEventListener('click', () => {
        window.location.href = './coupons.html';
      });
      $('#statAuth').addEventListener('click', openRealNameModal);

      // Logout
      $('#logoutBtnProfile').addEventListener('click', logout);
    }

    // ======== Init ========
    async function init() {
      if (!initState()) return;
      bindEvents();
      await loadUserInfo();
      await loadStats();
    }

    // Start
    document.addEventListener('DOMContentLoaded', init);
  })();
  </script>
</body>
</html>
